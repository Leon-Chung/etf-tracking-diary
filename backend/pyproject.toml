# ============================================================
# pyproject.toml
# ============================================================
#
# pyproject.toml 是 Python 專案的重要設定檔。
#
# 它可以用來管理：
# 1. 專案基本資訊
# 2. Python 版本需求
# 3. 專案直接依賴的 Python 套件
# 4. Build（建置）相關設定
# 5. 各種 Python 開發工具的設定
#
# ------------------------------------------------------------
# 為什麼需要 pyproject.toml？
# ------------------------------------------------------------
#
# 假設未來：
#
# 1. 我換了一台電腦
# 2. 其他工程師 Clone 這個專案
# 3. CI/CD 建立一個全新的 Python 環境
#
# 新環境一開始不會知道這個專案需要哪些 Python 套件。
#
# 因此，我們需要一個正式的專案設定檔，
# 告訴 Python / 開發工具：
#
# 「這個專案需要哪些 Python 套件，以及需要什麼版本的環境。」
#
# ------------------------------------------------------------
# 目前這個專案的主要直接依賴：
# ------------------------------------------------------------
#
# FastAPI          → 建立 Web API
# Uvicorn          → 啟動 FastAPI Application Server
# SQLAlchemy       → ORM / Database Layer
# psycopg2-binary  → PostgreSQL Driver
# python-dotenv    → 從 .env 載入環境變數
# Alembic          → Database Schema Migration
# pytest           → 執行測試
#
# ------------------------------------------------------------
# 注意：
# ------------------------------------------------------------
#
# 不需要把 pip list 裡面的所有套件全部寫進來。
#
# 因為其中很多套件是其他套件所依賴的「間接依賴
#（Transitive Dependencies）」。
#
# 我們主要管理的是：
# 「這個專案直接使用的套件」。
#
# ============================================================


[project]
#   ↓ 
#「下面這些設定都是關於這個 Python 專案本身: 正式執行專案需要的套件」

# name 是這個 Python 專案的名稱
name = "etf-tracking-diary"

# version 是這個 Python 專案目前的版本號
version = "0.1.0"

# requires-python 是這個專案需要哪個版本以上的 Python 才能執行
requires-python = ">=3.14"

# dependencies 是這個專案需要哪些 Python 套件才能運作
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "alembic",
]

[dependency-groups]

# dev = 開發環境才需要的套件。
dev = [
    "pytest",
]


# ============================================================

# 上述條件建立後，至後端資料夾(backend 內)執行下列指令

# ------------------------------------------------------------
# pip install -e .
# ------------------------------------------------------------
# 解釋:
# 在 backend 專案目錄執行：
#
#     pip install -e .
#
# 「.」代表目前所在的專案目錄。
#
# pip 會讀取目前目錄中的 pyproject.toml，
# 取得專案資訊與 dependencies。
#
# -e 代表 editable install（可編輯安裝）。
#
# 使用 editable install 後，
# 我們修改 backend/app/ 裡的 Python 程式碼時，
# 不需要每次重新安裝整個專案。
#
# 流程可以簡單理解為：
#
# pip install -e .
#        ↓
# 讀取 pyproject.toml
#        ↓
# 取得專案資訊與依賴
#        ↓
# 以 Editable Mode 安裝 Python 專案
#        ↓
# 安裝 / 確認專案所需要的依賴套件
#
# ------------------------------------------------------------

# 注意 :
# 新增 / 修改 pyproject.toml 的「dependencies」或「dependency-groups」後 → 請再次執行一次 pip install -e .。

